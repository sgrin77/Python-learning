name: Sector Scout digest

on:
  schedule:
    - cron: "17 12 * * 1" # Mondays 12:17 UTC
  workflow_dispatch:
    inputs:
      sectors:
        description: "Comma separated sector keys (blank = all)"
        required: false
        default: ""
      days:
        description: "Look back this many days (blank = config default)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sector-scout
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: sector-scout
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sector-scout/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # Keeps the knowledge base between runs (search history, and no
      # re-analysis of items already processed).
      - name: Restore knowledge base
        uses: actions/cache@v4
        with:
          path: sector-scout/data
          key: sector-scout-db-${{ github.run_id }}
          restore-keys: sector-scout-db-

      - name: Run Sector Scout
        env:
          INPUT_SECTORS: ${{ github.event.inputs.sectors }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          args=()
          [ -n "$INPUT_SECTORS" ] && args+=(--sectors "$INPUT_SECTORS")
          [ -n "$INPUT_DAYS" ] && args+=(--days "$INPUT_DAYS")
          [ -n "$SMTP_HOST" ] && args+=(--email)
          python -m sector_scout run "${args[@]}"
          cat digests/latest.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sector-scout-digest
          path: |
            sector-scout/digests/*.md
            sector-scout/digests/*.html

      - name: Commit digest to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          if git diff --cached --quiet; then
            echo "No digest changes to commit"
            exit 0
          fi
          git commit -m "Sector Scout digest $(date -u +%F)"
          git pull --rebase
          git push
